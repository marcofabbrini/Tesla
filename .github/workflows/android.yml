name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Test e build APK debug
        run: gradle testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Pubblica l'APK nella Release "latest"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TeslaChargeCost.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TeslaChargeCost.apk \
            --target "${{ github.sha }}" \
            --title "Tesla Charge Cost (ultima build)" \
            --notes "APK debug installabile su Android. Scaricalo dal telefono e abilita l'installazione da fonti sconosciute." \
            --latest
